<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRASANDINO AI CRM</title>
</head>

<body>

  <h1>TRASANDINO AI CRM</h1>
  <p>Prueba de conexión directa con Meta.</p>

  <button onclick="conectarMeta()">
    CONECTAR CON META
  </button>

  <p id="estado">Esperando conexión...</p>

  <script>
    window.fbAsyncInit = function() {

      FB.init({
        appId: '1962280114452695',
        cookie: true,
        xfbml: false,
        version: 'v26.0'
      });

      document.getElementById("estado").innerText =
        "SDK de Meta cargado correctamente.";
    };

    (function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];

      if (d.getElementById(id)) return;

      js = d.createElement(s);
      js.id = id;
      js.src = "https://connect.facebook.net/es_LA/sdk.js";

      fjs.parentNode.insertBefore(js, fjs);

    }(document, 'script', 'facebook-jssdk'));


    function conectarMeta() {

  document.getElementById("estado").innerText =
    "Abriendo Meta...";

  FB.login(function(response) {

    console.log(
      "RESPUESTA EMBEDDED SIGNUP:",
      response
    );

    console.log(
      "AUTH RESPONSE:",
      response.authResponse
    );

    if (
  response.authResponse &&
  response.authResponse.code
) {

  const codigo = response.authResponse.code;

  document.getElementById("estado").innerText =
    "Guardando conexión con Meta...";

  const urlAppsScript =
    "https://script.google.com/macros/s/AKfycbzIePYGGgSwX4NHgyDcBe7DZSri_4RaSWX4TcwSRUgd95EeHllDHY64rz7fSQWRF3fZhA/exec";

  const formulario = new URLSearchParams();
  formulario.append("accion", "meta_conectar");
  formulario.append("code", codigo);

  fetch(urlAppsScript, {
    method: "POST",
    body: formulario
  })
  .then(respuesta => respuesta.json())
  .then(datos => {

    if (datos.ok) {
      document.getElementById("estado").innerText =
        "META CONECTADO Y TOKEN GUARDADO";
    } else {
      document.getElementById("estado").innerText =
        "Meta respondió, pero no se pudo guardar la conexión.";
    }

  })
  .catch(error => {

    console.error("Error al guardar conexión:", error);

    document.getElementById("estado").innerText =
      "Error al enviar la conexión al servidor.";
  });

} else {

  document.getElementById("estado").innerText =
    "Meta no completó la conexión";

}

     

  }, {
    config_id: '928193306544182',
    response_type: 'code',
    override_default_response_type: true,
    extras: {
      setup: {},
      featureType:
        'whatsapp_business_app_onboarding'
    }
  });
}
  </script>

</body>
</html>
